channels:
  - pytorch
  - nvidia
  - conda-forge
  - nodefaults  # ensure default channel is not used due to its ToS

dependencies:
  - python>=3.10
  - pip>=24
  - pytorch::faiss-cpu>=1.7.4
  - conda-forge::ffmpeg>=6,<7
  - libmagic
  - sqlite
  - blas
  - pip:
    - -r requirements.txt
variables:
  PYTHONNOUSERSITE: 1
