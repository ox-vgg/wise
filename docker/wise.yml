channels:
  - pytorch
  - nvidia
  - conda-forge
  - nodefaults

dependencies:
  - python>=3.10
  - pip>=24
  - pytorch::faiss-cpu>=1.7.4
  - conda-forge::ffmpeg>=6,<7
  - libmagic
  - blas=*=openblas
  - pip:
    - torch>=2.2.2
    - torchvision>=0.16.0
    - torchaudio>=2.2.2
    - open-clip-torch>=2.24.0
    - transformers[sentencepiece] # Required for loading HF models in open clip, We are installing from pip since the conda package is bloated
    - fastapi[all]>=0.110.1
    - pydantic>2
    - pydantic-settings
    - sqlalchemy>=2.0.29
    - tqdm>=4.66.2
    - typer>=0.12.3
    - webdataset>=0.2.53
    - python-magic>=0.4.27
    # Install msclap separately till we pip freeze
    - torchlibrosa # Not available on conda
    - PyYAML>=6.0.1
    # pip install --no-deps msclap==1.3.3

variables:
  PYTHONNOUSERSITE: 1