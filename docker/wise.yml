channels:
  - pytorch
  - nvidia
  - conda-forge
  - nodefaults

dependencies:
  - python>=3.10
  - pip>=24
  - pytorch::faiss-cpu>=1.7.4
  - conda-forge::ffmpeg>=6,<7
  - libmagic
  - sqlite
  - blas=*=openblas
  - pip:
    - torch>=2.2.2,<2.9
    - torchvision>=0.16.0
    - torchaudio>=2.2.2
    - insightface
    - open-clip-torch>=2.24.0
    - transformers[sentencepiece] # Required for loading HF models in open clip, We are installing from pip since the conda package is bloated
    - fastapi[all]>=0.110.1
    - pydantic>2
    - pydantic-settings
    - sqlalchemy>=2.0.42
    - tqdm>=4.66.2
    - typer>=0.12.3
    - webdataset>=0.2.53
    - wids
    - python-magic>=0.4.27
    - filetype>=1.2.0,<2
    - webvtt-py
    - msclap>=1.3.4
    - accelerate
    - tritonclient[all]

variables:
  PYTHONNOUSERSITE: 1
