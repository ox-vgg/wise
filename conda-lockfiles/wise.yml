channels:
  - pytorch
  - nvidia
  - conda-forge
  - nodefaults

dependencies:
  - python>=3.10
  - pip>=24
  - pytorch::faiss-cpu>=1.7.4
  - conda-forge::pytorch>=2.2 
  - conda-forge::torchvision>=0.16
  - conda-forge::torchaudio>=2.2
  - conda-forge::ffmpeg>=6,<7
  - libmagic # [unix]
  # Blas stuff, we are repeating since conda-lock doesnt support and / or / not
  - blas=*=mkl # [linux64]
  - blas=*=mkl # [win64]
  - blas=*=openblas # [aarch64]
  - blas=*=accelerate # [osx]
  - mkl>=2023 # [linux64]
  - mkl>=2023 # [win64]
  # conda-lock specific issue - Keeping open_clip_torch here instead of pip
  - open-clip-torch>=2.24.0
  - pip:
    - python-magic>=0.4.27
    - python-magic-bin # [win]
    - transformers[sentencepiece] # Required for loading HF models in open clip, We are installing from pip since the conda package is bloated
    - fastapi[all]>=0.110.1
    - pydantic>2
    - pydantic-settings
    - sqlalchemy>=2.0.29
    - tqdm>=4.66.2
    - typer>=0.12.3
    - webdataset>=0.2.53
    # Install msclap separately till we pip freeze
    - torchlibrosa # Not available on conda
    - PyYAML>=6.0.1
    # pip install --no-deps msclap==1.3.3

variables:
  PYTHONNOUSERSITE: 1

platforms:
  - linux-64
  - linux-aarch64
